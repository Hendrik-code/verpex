name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # Poetry dependency *groups* are not pip *extras*, so `pip install .[dev]`
        # would fail; the dev tools are installed explicitly instead.
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest coverage
      - name: Test
        # Coverage settings (source, omissions) live in pyproject.toml.
        run: |
          coverage run -m pytest -v
          coverage xml
      - name: Upload coverage to Codecov
        # One upload per commit is enough: the matrix differs only in interpreter
        # version, not in which lines run.
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          # A Codecov outage should not turn the test suite red.
          fail_ci_if_error: false
